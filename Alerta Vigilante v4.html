<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Vigilante - Sistema de Deteção</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #09090b; 
            color: #e4e4e7; 
            font-family: 'Inter', sans-serif;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .hud-container {
            position: relative;
            background-color: #000;
            border: 1px solid #27272a;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        
        .hud-container.alert {
            box-shadow: 0 0 0 2px #ef4444, 0 0 40px rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
        }

        .scanner-line {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(239, 68, 68, 0.9);
            box-shadow: 0 0 15px 2px #ef4444, 0 20px 20px rgba(239,68,68,0.2);
            z-index: 20;
            animation: scan 1.5s infinite linear;
        }
        .hud-container.alert .scanner-line { display: block; }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border-color: rgba(255, 255, 255, 0.3);
            border-style: solid;
            z-index: 10;
            transition: border-color 0.3s;
        }
        .hud-container.alert .corner { border-color: #ef4444; }
        
        .c-tl { top: 15px; left: 15px; border-width: 2px 0 0 2px; }
        .c-tr { top: 15px; right: 15px; border-width: 2px 2px 0 0; }
        .c-bl { bottom: 15px; left: 15px; border-width: 0 0 2px 2px; }
        .c-br { bottom: 15px; right: 15px; border-width: 0 2px 2px 0; }

        /* Estilizando as novas células da grelha de deteção */
        .grid-cell {
            border: 1px dashed rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease-out;
        }
        .grid-cell.active {
            background-color: rgba(239, 68, 68, 0.4);
            border-color: rgba(239, 68, 68, 0.9);
            box-shadow: inset 0 0 40px rgba(239, 68, 68, 0.6);
            z-index: 30;
        }

        .process-canvas { display: none; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="min-h-screen flex flex-col h-screen overflow-hidden">

    <!-- Navbar -->
    <nav class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur-md px-6 py-4 flex justify-between items-center z-30 shrink-0">
        <div class="flex items-center gap-4">
            <div class="relative flex h-12 w-12 items-center justify-center rounded-xl bg-blue-500/10 border border-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.15)]">
                <i class="fas fa-satellite-dish text-blue-400 text-xl"></i>
                <div class="absolute -top-1 -right-1 flex h-3.5 w-3.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-blue-500 border-2 border-zinc-950"></span>
                </div>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white shadow-black drop-shadow-md">ALERTA VIGILANTE</h1>
                <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-400 font-semibold">Módulo de Análise Visual Múltipla</p>
            </div>
        </div>
        
        <div class="flex items-center gap-8">
            <!-- Seletor de Mosaico (Grelha) -->
            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] uppercase tracking-wider text-zinc-500 font-semibold flex items-center gap-2">
                    <i class="fas fa-th"></i> Divisão (Mosaico)
                </label>
                <select id="grid-size" class="bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-zinc-300 outline-none focus:border-blue-500 cursor-pointer h-[34px]">
                    <option value="2">2x2 (4 Câm)</option>
                    <option value="3">3x3 (9 Câm)</option>
                    <option value="4" selected>4x4 (16 Câm)</option>
                    <option value="5">5x5 (25 Câm)</option>
                </select>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] uppercase tracking-wider text-zinc-500 font-semibold flex items-center gap-2">
                    <i class="fas fa-crosshairs"></i> Sensibilidade Base
                </label>
                <div class="flex items-center gap-3 bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2 shadow-inner h-[34px]">
                    <i class="fas fa-minus text-zinc-600 text-xs"></i>
                    <input type="range" id="sensitivity" min="10" max="100" value="50" class="w-32 accent-blue-500 cursor-pointer">
                    <i class="fas fa-plus text-zinc-600 text-xs"></i>
                </div>
            </div>
            
            <button id="btn-activate" class="relative group overflow-hidden rounded-lg bg-zinc-900 border border-zinc-800 px-6 py-3.5 text-sm font-semibold text-zinc-300 transition-all hover:border-zinc-700 flex items-center gap-3 shadow-lg">
                <i class="fas fa-power-off text-zinc-500 transition-colors" id="btn-icon"></i> 
                <span id="btn-text">Armar Sistema</span>
            </button>
        </div>
    </nav>

    <!-- Monitorização -->
    <main class="flex-1 p-6 flex flex-col min-h-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')]">
        
        <div class="hud-container flex-1 flex flex-col w-full h-full" id="cam-container-1">
            <div class="scanner-line"></div>
            <div class="corner c-tl"></div>
            <div class="corner c-tr"></div>
            <div class="corner c-bl"></div>
            <div class="corner c-br"></div>
            
            <!-- Barra Superior -->
            <div class="absolute top-0 left-0 right-0 p-4 flex justify-between z-10 bg-gradient-to-b from-black/90 via-black/50 to-transparent pointer-events-none">
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 font-mono text-xs text-blue-400 font-bold bg-black/40 px-2 py-1 rounded backdrop-blur-sm">
                        <span class="w-2.5 h-2.5 rounded-full bg-red-600 animate-pulse border border-red-400"></span>
                        REC_SCREEN_01
                    </div>
                    <div class="font-mono text-xs text-yellow-400 bg-black/40 px-2 py-1 rounded backdrop-blur-sm border border-zinc-800 transition-colors duration-500" id="env-mode-1">
                        <i class="fas fa-adjust animate-spin-slow"></i> A CALIBRAR LUZ...
                    </div>
                </div>
                
                <div class="font-mono text-xs text-zinc-400 bg-black/40 px-3 py-1 rounded backdrop-blur-sm border border-zinc-800" id="status-1">
                    AGUARDANDO CONEXÃO...
                </div>
            </div>

            <!-- Mira Central -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-30 z-10 mix-blend-screen">
                <div class="w-32 h-32 border border-zinc-600 rounded-full flex items-center justify-center relative">
                    <div class="w-1 h-3 absolute -top-1 bg-zinc-400"></div>
                    <div class="w-1 h-3 absolute -bottom-1 bg-zinc-400"></div>
                    <div class="w-3 h-1 absolute -left-1 bg-zinc-400"></div>
                    <div class="w-3 h-1 absolute -right-1 bg-zinc-400"></div>
                    <div class="w-1.5 h-1.5 bg-blue-500 rounded-full opacity-50"></div>
                </div>
            </div>

            <!-- Camada visual da Grelha sobre o Vídeo -->
            <div id="grid-overlay" class="absolute inset-0 z-10 grid pointer-events-none w-full h-full"></div>

            <video id="video-1" class="w-full h-full object-fill relative z-0" autoplay muted playsinline></video>
            
            <!-- Canvas de Processamento -->
            <canvas id="canvas-1" class="process-canvas" width="128" height="96"></canvas>
            
            <div id="video-overlay" class="absolute inset-0 bg-zinc-900/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center text-zinc-500 font-mono transition-opacity duration-500">
                <i class="fas fa-desktop text-4xl mb-4 opacity-50"></i>
                <p>A aguardar inicialização do ecrã de captura.</p>
                <p class="text-xs mt-2 opacity-50">O sistema pedirá acesso à janela após o carregamento.</p>
            </div>
        </div>
    </main>

    <!-- Terminal -->
    <footer class="h-48 border-t border-zinc-800 bg-zinc-950 flex flex-col shrink-0 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] z-20">
        <div class="px-6 py-2 border-b border-zinc-900 bg-zinc-900/30 flex justify-between items-center shrink-0">
            <span class="text-[10px] font-mono text-zinc-400 uppercase tracking-widest flex items-center gap-2">
                <i class="fas fa-terminal text-zinc-600"></i> Terminal de Ocorrências
            </span>
            <div class="flex items-center gap-4">
                <span class="text-[10px] font-mono text-zinc-500 uppercase tracking-wider">Desenvolvido por <span class="text-blue-500 font-bold">VNZINDEV</span></span>
                <span class="text-[10px] font-mono text-zinc-600" id="clock">00:00:00</span>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-6 font-mono text-xs" id="log-panel">
            <ul id="log-list" class="space-y-1.5 flex flex-col justify-end min-h-full"></ul>
        </div>
    </footer>

    <script>
        // Variáveis
        let alertsEnabled = false;
        let audioContext = null;
        let lastAlarmTime = 0;
        const ALARM_COOLDOWN = 5000;
        let detectionInterval = null;

        const btnActivate = document.getElementById('btn-activate');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const sensitivityInput = document.getElementById('sensitivity');
        const gridSizeInput = document.getElementById('grid-size');
        const logList = document.getElementById('log-list');
        const videoOverlay = document.getElementById('video-overlay');
        const gridOverlay = document.getElementById('grid-overlay');

        setInterval(() => {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-PT');
        }, 1000);

        const PROCESS_WIDTH = 128; 
        const PROCESS_HEIGHT = 96;
        const TOTAL_PIXELS = PROCESS_WIDTH * PROCESS_HEIGHT;
        
        const cameras = [{
            id: 1,
            video: document.getElementById('video-1'),
            canvas: document.getElementById('canvas-1'),
            ctx: document.getElementById('canvas-1').getContext('2d', { willReadFrequently: true }),
            container: document.getElementById('cam-container-1'),
            statusUI: document.getElementById('status-1'),
            envUI: document.getElementById('env-mode-1'),
            name: "Sistema Principal",
            lastImageData: null,
            lastBrightness: 128,
            isActive: false
        }];

        // Lógica de inicialização da Grelha
        let currentGridSize = 4;
        
        function updateGrid() {
            currentGridSize = parseInt(gridSizeInput.value);
            gridOverlay.style.gridTemplateColumns = `repeat(${currentGridSize}, 1fr)`;
            gridOverlay.style.gridTemplateRows = `repeat(${currentGridSize}, 1fr)`;
            gridOverlay.innerHTML = '';
            
            const totalCells = currentGridSize * currentGridSize;
            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.id = `grid-cell-${i}`;
                cell.className = 'grid-cell relative';
                
                const label = document.createElement('span');
                label.className = 'absolute bottom-1 right-1 text-[9px] font-mono font-bold text-white/30';
                label.textContent = `SETOR ${i + 1}`;
                cell.appendChild(label);
                
                gridOverlay.appendChild(cell);
            }
        }
        
        gridSizeInput.addEventListener('change', updateGrid);
        updateGrid(); // Monta a grelha inicial (4x4)

        async function init() {
            addLog("A iniciar boot do Alerta Vigilante v4.0 (Sensível + Mosaico)...", "sys");
            addLog("A solicitar acesso à captura de ecrã (Selecione a janela das câmaras)...", "normal");
            
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                
                cameras[0].video.srcObject = stream;
                cameras[0].isActive = true;
                
                cameras[0].statusUI.textContent = "SINAL ESTÁVEL";
                cameras[0].statusUI.className = "font-mono text-xs text-green-400 bg-green-900/20 px-3 py-1 rounded backdrop-blur-sm border border-green-800/50";
                
                videoOverlay.classList.add('opacity-0');
                setTimeout(() => videoOverlay.style.display = 'none', 500);

                stream.getVideoTracks()[0].onended = () => {
                    addLog("Sinal de vídeo interrompido pelo utilizador.", "error");
                    cameras[0].isActive = false;
                    cameras[0].statusUI.textContent = "SINAL PERDIDO";
                    cameras[0].statusUI.className = "font-mono text-xs text-red-500 bg-red-900/20 px-3 py-1 rounded backdrop-blur-sm border border-red-800/50";
                    videoOverlay.style.display = 'flex';
                    setTimeout(() => videoOverlay.classList.remove('opacity-0'), 10);
                };
                
                // Intervalo reduzido para 150ms (Deteta movimento rápido com maior precisão)
                detectionInterval = setInterval(processMotion, 150);
                addLog("Captura estabelecida. Motor de Setores Ativo (150ms ping).", "success");

            } catch (err) {
                addLog(`FALHA CRÍTICA: Acesso ao ecrã recusado (${err.message})`, "error");
                cameras[0].statusUI.textContent = "ERRO DE LIGAÇÃO";
                cameras[0].statusUI.className = "font-mono text-xs text-red-500 bg-red-900/20 px-3 py-1 rounded backdrop-blur-sm border border-red-800/50";
            }
        }

        btnActivate.addEventListener('click', async () => {
            if (!alertsEnabled) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                if ("Notification" in window) {
                    const permission = await Notification.requestPermission();
                    if (permission === "granted") {
                        alertsEnabled = true;
                        
                        btnText.textContent = 'Sistema Armado';
                        btnIcon.className = 'fas fa-shield-alt text-blue-400 shadow-blue-500 drop-shadow-md';
                        btnActivate.classList.remove('bg-zinc-900', 'border-zinc-800', 'hover:border-zinc-700');
                        btnActivate.classList.add('bg-blue-900/20', 'border-blue-500/50', 'hover:border-blue-400');
                        
                        addLog("Sistema ARMADO. Alarmes e notificações ativados.", "success");
                    } else {
                        addLog("Permissão para notificações do SO recusada.", "error");
                        alert("Permita as notificações no navegador.");
                    }
                }
            } else {
                alertsEnabled = false;
                
                btnText.textContent = 'Armar Sistema';
                btnIcon.className = 'fas fa-power-off text-zinc-500';
                btnActivate.classList.add('bg-zinc-900', 'border-zinc-800', 'hover:border-zinc-700');
                btnActivate.classList.remove('bg-blue-900/20', 'border-blue-500/50', 'hover:border-blue-400');
                
                addLog("Sistema DESARMADO. Alarmes suspensos.", "sys");
            }
        });

        function playSiren() {
            if (!audioContext || !alertsEnabled) return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.type = 'square';
            const now = audioContext.currentTime;
            
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.setValueAtTime(2000, now + 0.1);
            osc.frequency.setValueAtTime(1500, now + 0.2);
            osc.frequency.setValueAtTime(2000, now + 0.3);
            osc.frequency.setValueAtTime(1500, now + 0.4);
            osc.frequency.setValueAtTime(2500, now + 0.5);
            osc.frequency.setValueAtTime(1500, now + 0.6);
            
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.5, now + 0.05);
            gain.gain.setValueAtTime(0.5, now + 0.65);
            gain.gain.linearRampToValueAtTime(0, now + 0.7);
            
            osc.start(now);
            osc.stop(now + 0.7);
        }

        // MOTOR ADAPTATIVO COM SETORES E SENSIBILIDADE MELHORADA
        function processMotion() {
            cameras.forEach(cam => {
                if (!cam.isActive || cam.video.readyState !== 4) return;

                cam.ctx.drawImage(cam.video, 0, 0, PROCESS_WIDTH, PROCESS_HEIGHT);
                const currentImageData = cam.ctx.getImageData(0, 0, PROCESS_WIDTH, PROCESS_HEIGHT);
                
                if (!cam.lastImageData) {
                    cam.lastImageData = currentImageData;
                    return;
                }

                // 1. Definições Base - Fórmulas ajustadas para MUITO MAIS sensibilidade
                let baseSensitivity = Number(sensitivityInput.value);
                let dynThresholdPixel = 70 - (baseSensitivity * 0.5); 
                let dynThresholdArea = 120 - baseSensitivity; 
                
                // 2. Análise do Ambiente Atual
                let envMode = "";
                let envClass = "";
                let envIcon = "";

                if (cam.lastBrightness > 120) {
                    envMode = "MODO DIA (ALTO CONTRASTE)";
                    envClass = "text-yellow-400 border-yellow-800/50";
                    envIcon = "fa-sun";
                } else if (cam.lastBrightness > 50) {
                    envMode = "MODO ENTARDECER (COMPENSADO)";
                    envClass = "text-orange-400 border-orange-800/50";
                    envIcon = "fa-cloud-sun";
                    dynThresholdPixel = dynThresholdPixel * 0.8;
                    dynThresholdArea = dynThresholdArea * 1.5;
                } else {
                    envMode = "MODO NOITE (FILTRO RUÍDO IR)";
                    envClass = "text-blue-400 border-blue-800/50";
                    envIcon = "fa-moon";
                    dynThresholdPixel = Math.max(15, dynThresholdPixel * 0.6);
                    dynThresholdArea = dynThresholdArea * 2.5; 
                }

                cam.envUI.innerHTML = `<i class="fas ${envIcon}"></i> ${envMode}`;
                cam.envUI.className = `font-mono text-xs bg-black/40 px-2 py-1 rounded backdrop-blur-sm border transition-colors duration-500 ${envClass}`;

                // 3. Processamento de movimento segregado por Setores
                let totalFrameBrightness = 0;
                const dataCurrent = currentImageData.data;
                const dataLast = cam.lastImageData.data;

                const cellWidth = PROCESS_WIDTH / currentGridSize;
                const cellHeight = PROCESS_HEIGHT / currentGridSize;
                const totalCells = currentGridSize * currentGridSize;
                const cellDiffs = new Array(totalCells).fill(0);
                
                // Adaptação da área necessária baseada no tamanho físico do setor na tela
                let cellThresholdArea = Math.max(5, dynThresholdArea / (totalCells * 0.4));

                let pixelIndex = 0;
                for (let y = 0; y < PROCESS_HEIGHT; y++) {
                    for (let x = 0; x < PROCESS_WIDTH; x++) {
                        const i = pixelIndex * 4;

                        // Luma do frame atual
                        const lum1 = 0.299 * dataCurrent[i] + 0.587 * dataCurrent[i+1] + 0.114 * dataCurrent[i+2];
                        totalFrameBrightness += lum1;

                        // Luma do frame anterior
                        const lum2 = 0.299 * dataLast[i] + 0.587 * dataLast[i+1] + 0.114 * dataLast[i+2];
                        
                        // Diferença de Luz (Movimento)
                        if (Math.abs(lum1 - lum2) > dynThresholdPixel) {
                            const col = Math.floor(x / cellWidth);
                            const row = Math.floor(y / cellHeight);
                            const cellIndex = row * currentGridSize + col;
                            
                            if (cellIndex >= 0 && cellIndex < totalCells) {
                                cellDiffs[cellIndex]++;
                            }
                        }
                        pixelIndex++;
                    }
                }

                cam.lastBrightness = totalFrameBrightness / TOTAL_PIXELS;

                // 4. Verificação de Disparo Setorial
                let triggeredSectors = [];
                for (let i = 0; i < cellDiffs.length; i++) {
                    if (cellDiffs[i] > cellThresholdArea) {
                        triggeredSectors.push(i);
                    }
                }

                if (triggeredSectors.length > 0) {
                    triggerAlarm(triggeredSectors);
                    
                    cam.container.classList.add('alert');
                    
                    // Piscar os quadrados específicos a vermelho!
                    triggeredSectors.forEach(index => {
                        const cellEl = document.getElementById(`grid-cell-${index}`);
                        if (cellEl) {
                            cellEl.classList.add('active');
                            setTimeout(() => {
                                cellEl.classList.remove('active');
                            }, 1500); 
                        }
                    });

                    setTimeout(() => {
                        cam.container.classList.remove('alert');
                    }, 1500);
                }

                cam.lastImageData = currentImageData;
            });
        }

        // Trigger Alarm com informação exata de setores
        function triggerAlarm(sectors = []) {
            const now = Date.now();
            if (now - lastAlarmTime < ALARM_COOLDOWN) return;
            lastAlarmTime = now;

            const timeString = new Date().toLocaleTimeString('pt-PT');
            const sectorNames = sectors.map(s => s + 1).join(", ");
            
            addLog(`>> INTRUSÃO DETETADA << Movimento na(s) câmara(s)/setor(es): [ ${sectorNames} ]`, "alert");

            if (alertsEnabled) {
                playSiren();
                if (Notification.permission === "granted") {
                    const notification = new Notification("ALERTA VIGILANTE - INTRUSÃO", {
                        body: `Atividade registada na Câmara (Setor: ${sectorNames}) às ${timeString}.`,
                        icon: "https://cdn-icons-png.flaticon.com/512/3233/3233483.png", 
                        requireInteraction: true 
                    });
                    notification.onclick = function() {
                        window.focus();
                        this.close();
                    };
                }
            }
        }

        function addLog(message, type = "normal") {
            const li = document.createElement('li');
            const time = new Date().toLocaleTimeString('pt-PT');
            
            let prefix = `<span class="text-zinc-600">[${time}]</span> `;
            
            if (type === "error") {
                li.className = "text-red-400";
                prefix += `<span class="text-red-600 font-bold">[ERR]</span> `;
            } else if (type === "success") {
                li.className = "text-blue-400";
                prefix += `<span class="text-blue-600 font-bold">[OK]</span> `;
            } else if (type === "alert") {
                li.className = "text-red-500 font-bold bg-red-900/20 px-2 py-0.5 rounded border-l-2 border-red-500 my-1 inline-block w-full";
                prefix = `<span class="text-red-400">[${time}]</span> <span class="animate-pulse">⚠</span> `;
            } else if (type === "sys") {
                li.className = "text-zinc-400";
                prefix += `<span class="text-zinc-500">[SYS]</span> `;
            } else {
                li.className = "text-zinc-300";
                prefix += `<span class="text-zinc-500">[LOG]</span> `;
            }

            li.innerHTML = `${prefix}${message}`;
            logList.appendChild(li);
            
            const panel = document.getElementById('log-panel');
            panel.scrollTop = panel.scrollHeight;
            
            if (logList.children.length > 50) {
                logList.removeChild(logList.firstChild);
            }
        }

        window.addEventListener('load', () => {
            addLog("Terminal Operacional. Aguardando comando de boot...", "sys");
            setTimeout(init, 1000);
        });

    </script>
</body>
</html>
