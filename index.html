<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilante Virtual PRO V10 - Pixel Premium</title>
    <style>
        :root {
            --bg: #0d1117; --panel: #161b22; --text: #c9d1d9;
            --accent: #2f81f7; --alert: #da3633; --border: #30363d;
            --day-color: #d29922; --night-color: #a371f7; --brand-color: #58a6ff;
        }

        body {
            margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; height: 100vh; overflow: hidden;
        }

        .main-view { flex: 1; display: flex; flex-direction: column; padding: 10px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
        .top-bar h1 { margin: 0; font-size: 1.1rem; color: #fff; }

        .mode-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; border: 1px solid var(--border); }
        .mode-day { background: rgba(210, 153, 34, 0.15); color: var(--day-color); border-color: var(--day-color); }
        .mode-night { background: rgba(163, 113, 247, 0.15); color: var(--night-color); border-color: var(--night-color); }

        .video-wrapper { flex: 1; background: #000; border: 1px solid var(--border); border-radius: 6px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #screen-video, #interaction-canvas { position: absolute; transform-origin: center center; }
        #interaction-canvas { z-index: 20; cursor: crosshair; }

        .sidebar { width: 330px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; z-index: 30; }
        .panel-section { padding: 15px; border-bottom: 1px solid var(--border); }
        .panel-section h3 { margin: 0 0 10px 0; font-size: 0.95rem; color: #fff; }

        .btn-action { width: 100%; background: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .btn-action:hover { filter: brightness(1.2); }
        .btn-secondary { background: #21262d; border: 1px solid var(--border); }
        .btn-danger { background: #da3633; }

        .slider-group { margin-bottom: 12px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; color: #8b949e; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .toggle-container { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; margin-top: 8px; }

        .log-area { flex: 1; padding: 15px; background: #010409; display: flex; flex-direction: column; min-height: 150px; }
        .log-list { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
        .log-item { padding: 8px; border-left: 3px solid var(--alert); background: rgba(218, 54, 51, 0.1); margin-bottom: 5px; font-size: 0.85rem; }

        #start-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(13, 17, 23, 0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .tab-box { background: #010409; border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-top: 8px; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1 style="color: white; margin-bottom: 5px;">Vigilante Virtual PRO V10</h1>
        <p style="color: #8b949e; margin-bottom: 20px;">Motor de Píxeis (Alta Sensibilidade para Distâncias)</p>
        <button class="btn-action" style="max-width: 280px; font-size: 1.1rem; padding: 15px;" id="btn-start">Iniciar Monitorização</button>
    </div>

    <div class="main-view">
        <div class="top-bar">
            <h1>Desenhe as zonas (Clique no X para fechar)</h1>
            <div id="mode-indicator" class="mode-badge mode-day">☀️ DIA ATIVO</div>
        </div>
        <div class="video-wrapper" id="video-wrapper">
            <video id="screen-video" autoplay muted playsinline></video>
            <canvas id="interaction-canvas"></canvas>
        </div>
    </div>

    <div class="sidebar">
        <div class="panel-section">
            <h3>🎯 Filtro Anti-Árvores (Persistência)</h3>
            <div class="slider-group">
                <label><span>Frames Contínuos Exigidos</span> <span id="val-frames">5</span></label>
                <input type="range" id="filter-frames" min="1" max="20" value="5">
            </div>
            <div class="toggle-container" style="background: rgba(47, 129, 247, 0.1); padding: 8px; border: 1px solid #2f81f7;">
                <span style="color: #2f81f7; font-weight: bold;">Modo Raio-X (Píxeis)</span>
                <input type="checkbox" id="debug-toggle">
            </div>
            <button class="btn-action btn-secondary" id="btn-clear-zones" style="margin-top:10px;">Limpar Todas as Zonas</button>
        </div>

        <div class="panel-section">
            <h3>🌙 Configuração de Sensibilidade</h3>
            <div class="toggle-container" style="margin-bottom: 10px;">
                <span>Troca Automática (18h-06h)</span>
                <input type="checkbox" id="auto-schedule" checked>
            </div>

            <div class="tab-box">
                <span style="color: var(--day-color); font-weight: bold; font-size: 0.85rem;">☀️ DIA</span>
                <div class="slider-group" style="margin-top: 8px;">
                    <label><span>Contraste</span> <span id="val-sens-day">25</span></label>
                    <input type="range" id="sens-day" min="10" max="100" value="25">
                </div>
                <div class="slider-group">
                    <label><span>Massa Mín. (Fundo)</span> <span id="val-quant-day">0.050%</span></label>
                    <input type="range" id="quant-day" min="0.001" max="1.0" step="0.001" value="0.050">
                </div>
            </div>

            <div class="tab-box">
                <span style="color: var(--night-color); font-weight: bold; font-size: 0.85rem;">🌙 NOITE</span>
                <div class="slider-group" style="margin-top: 8px;">
                    <label><span>Contraste</span> <span id="val-sens-night">18</span></label>
                    <input type="range" id="sens-night" min="10" max="100" value="18">
                </div>
                <div class="slider-group">
                    <label><span>Massa Mín. (Fundo)</span> <span id="val-quant-night">0.020%</span></label>
                    <input type="range" id="quant-night" min="0.001" max="1.0" step="0.001" value="0.020">
                </div>
            </div>
        </div>

        <div class="log-area">
            <h3 style="margin: 0 0 10px 0; font-size: 0.95rem; color: #fff;">Registo (Logs)</h3>
            <ul class="log-list" id="alert-log"></ul>
        </div>
    </div>

    <script>
        const btnStart = document.getElementById('btn-start');
        const overlay = document.getElementById('start-overlay');
        const video = document.getElementById('screen-video');
        const canvas = document.getElementById('interaction-canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('video-wrapper');
        const alertLog = document.getElementById('alert-log');
        
        let isDetecting = false;
        let isNightTime = false;
        let detectionZones = [];
        let isDrawing = false;
        let startX, startY;
        let audioContext;

        const processCanvas = document.createElement('canvas');
        const processCtx = processCanvas.getContext('2d', { willReadFrequently: true });
        let previousFrame = null;

        // Inputs
        const debugToggle = document.getElementById('debug-toggle');
        const filterFrames = document.getElementById('filter-frames');
        const sensDay = document.getElementById('sens-day');
        const quantDay = document.getElementById('quant-day');
        const sensNight = document.getElementById('sens-night');
        const quantNight = document.getElementById('quant-night');
        const autoSchedule = document.getElementById('auto-schedule');
        const modeIndicator = document.getElementById('mode-indicator');

        let activeDiffThreshold = 25;
        let activeMotionThreshold = 0.0005; 
        
        filterFrames.oninput = () => document.getElementById('val-frames').innerText = filterFrames.value;

        function updateSensorsValues() {
            document.getElementById('val-sens-day').innerText = sensDay.value;
            document.getElementById('val-quant-day').innerText = parseFloat(quantDay.value).toFixed(3) + '%';
            document.getElementById('val-sens-night').innerText = sensNight.value;
            document.getElementById('val-quant-night').innerText = parseFloat(quantNight.value).toFixed(3) + '%';

            const h = new Date().getHours();
            isNightTime = autoSchedule.checked ? (h >= 18 || h < 6) : false;

            if (isNightTime) {
                modeIndicator.className = "mode-badge mode-night"; modeIndicator.innerText = "🌙 MODO NOITE ATIVO";
                activeDiffThreshold = parseInt(sensNight.value);
                activeMotionThreshold = parseFloat(quantNight.value) / 100;
            } else {
                modeIndicator.className = "mode-badge mode-day"; modeIndicator.innerText = "☀️ MODO DIA ATIVO";
                activeDiffThreshold = parseInt(sensDay.value);
                activeMotionThreshold = parseFloat(quantDay.value) / 100;
            }
        }
        [sensDay, quantDay, sensNight, quantNight, autoSchedule].forEach(el => el.addEventListener('input', updateSensorsValues));
        setInterval(updateSensorsValues, 60000);
        updateSensorsValues();

        // Worker para não travar a UI
        const workerCode = `let t; self.onmessage = function(e) { if(e.data==='start') t = setInterval(()=>self.postMessage('tick'), 80); else clearInterval(t); };`;
        const ticker = new Worker(URL.createObjectURL(new Blob([workerCode], {type: 'application/javascript'})));
        ticker.onmessage = () => { if(isDetecting) processFrame(); };

        function resizeCanvas() {
            if (!video.videoWidth) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const scale = Math.min(wrapper.clientWidth / video.videoWidth, wrapper.clientHeight / video.videoHeight);
            const w = video.videoWidth * scale; const h = video.videoHeight * scale;
            video.style.width = w + 'px'; video.style.height = h + 'px';
            canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
            
            processCanvas.width = 640; 
            processCanvas.height = (640 / video.videoWidth) * video.videoHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            // Verifica clique no X (Baseado na resolução real do vídeo)
            for (let i = detectionZones.length - 1; i >= 0; i--) {
                const z = detectionZones[i];
                if (pos.x >= z.x + z.w - 40 && pos.x <= z.x + z.w && pos.y >= z.y && pos.y <= z.y + 40) {
                    detectionZones.splice(i, 1);
                    drawZones();
                    return;
                }
            }
            isDrawing = true; startX = pos.x; startY = pos.y;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawZones();
            ctx.strokeStyle = '#2f81f7'; ctx.lineWidth = 2;
            ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const pos = getMousePos(e);
            const w = pos.x - startX; const h = pos.y - startY;
            if (Math.abs(w) > 20 && Math.abs(h) > 20) {
                detectionZones.push({
                    x: Math.min(startX, pos.x), y: Math.min(startY, pos.y),
                    w: Math.abs(w), h: Math.abs(h),
                    alertLevel: 0, isAlerting: false, lastAlertTime: 0
                });
            }
            drawZones();
        });

        document.getElementById('btn-clear-zones').onclick = () => { detectionZones = []; drawZones(); };

        function drawZones() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const reqFrames = parseInt(filterFrames.value);

            detectionZones.forEach((z, idx) => {
                ctx.strokeStyle = z.isAlerting ? '#da3633' : (z.alertLevel > 0 ? '#d29922' : 'rgba(47, 129, 247, 0.8)');
                ctx.fillStyle = z.isAlerting ? 'rgba(218, 54, 51, 0.25)' : 'rgba(47, 129, 247, 0.05)';
                ctx.lineWidth = 3;
                ctx.fillRect(z.x, z.y, z.w, z.h); ctx.strokeRect(z.x, z.y, z.w, z.h);

                // Numero
                ctx.fillStyle = '#0d1117'; ctx.fillRect(z.x, z.y, 35, 35);
                ctx.fillStyle = '#fff'; ctx.font = '18px Arial'; ctx.fillText(idx + 1, z.x + 12, z.y + 25);

                // Botão X
                ctx.fillStyle = '#da3633'; ctx.fillRect(z.x + z.w - 40, z.y, 40, 40);
                ctx.fillStyle = '#fff'; ctx.font = '22px Arial'; ctx.fillText('X', z.x + z.w - 28, z.y + 28);

                // Barra Anti-Falsos
                if (z.alertLevel > 0 && !z.isAlerting) {
                    ctx.fillStyle = '#d29922';
                    ctx.fillRect(z.x, z.y + z.h - 8, (z.w * (z.alertLevel / reqFrames)), 8);
                }
            });
        }

        btnStart.addEventListener('click', async () => {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "never" }, audio: false });
                video.srcObject = stream;
                overlay.style.display = 'none';

                video.onloadeddata = () => {
                    resizeCanvas();
                    isDetecting = true;
                    previousFrame = null;
                    ticker.postMessage('start');
                };

                stream.getVideoTracks()[0].onended = () => {
                    isDetecting = false;
                    ticker.postMessage('stop');
                    overlay.style.display = 'flex';
                };
            } catch (err) { alert("Erro ao capturar ecrã."); }
        });

        function triggerAlert(idx) {
            const z = detectionZones[idx];
            z.isAlerting = true;
            z.lastAlertTime = Date.now();
            
            if (audioContext) {
                if (audioContext.state === 'suspended') audioContext.resume();
                const osc = audioContext.createOscillator();
                osc.type = 'square'; osc.frequency.setValueAtTime(880, audioContext.currentTime);
                osc.connect(audioContext.destination);
                osc.start(); osc.stop(audioContext.currentTime + 0.3);
            }

            const li = document.createElement('li');
            li.className = 'log-item';
            li.innerHTML = `Movimento (Píxeis) - <b>Zona ${idx + 1}</b> às ${new Date().toLocaleTimeString('pt-PT')}`;
            alertLog.prepend(li);
            if(alertLog.children.length > 30) alertLog.lastChild.remove();

            setTimeout(() => { z.isAlerting = false; drawZones(); }, 1500);
        }

        function processFrame() {
            if (!isDetecting) return;
            const pW = processCanvas.width; const pH = processCanvas.height;
            processCtx.drawImage(video, 0, 0, pW, pH);
            const currentFrame = processCtx.getImageData(0, 0, pW, pH);
            
            drawZones();
            const isDebug = debugToggle.checked;
            const reqFrames = parseInt(filterFrames.value);
            const scaleX = canvas.width / pW; const scaleY = canvas.height / pH;

            if (previousFrame && detectionZones.length > 0) {
                for (let z = 0; z < detectionZones.length; z++) {
                    const zone = detectionZones[z];
                    if (Date.now() - zone.lastAlertTime < 2000) continue; // Cooldown 2s
                    
                    const sX = Math.floor((zone.x / canvas.width) * pW);
                    const sY = Math.floor((zone.y / canvas.height) * pH);
                    const zW = Math.floor((zone.w / canvas.width) * pW);
                    const zH = Math.floor((zone.h / canvas.height) * pH);
                    
                    let changed = 0;

                    for (let y = sY; y < sY + zH; y++) {
                        for (let x = sX; x < sX + zW; x++) {
                            const i = (y * pW + x) * 4;
                            const diff = Math.abs(currentFrame.data[i] - previousFrame.data[i]) + 
                                         Math.abs(currentFrame.data[i+1] - previousFrame.data[i+1]) + 
                                         Math.abs(currentFrame.data[i+2] - previousFrame.data[i+2]);

                            if (diff > activeDiffThreshold * 3) {
                                changed++;
                                if (isDebug && (changed % 2 === 0)) {
                                    ctx.fillStyle = 'rgba(0, 255, 0, 0.8)';
                                    ctx.fillRect(x * scaleX, y * scaleY, 3, 3);
                                }
                            }
                        }
                    }

                    const percent = changed / (zW * zH);

                    if (percent > activeMotionThreshold) {
                        zone.alertLevel++;
                        if (zone.alertLevel >= reqFrames) {
                            triggerAlert(z);
                            zone.alertLevel = 0;
                        }
                    } else {
                        if (zone.alertLevel > 0) zone.alertLevel--; // Desce gradualmente
                    }
                }
            }
            previousFrame = currentFrame;
        }
    </script>
</body>
</html>
